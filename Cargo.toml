[package]
name = "agent-assurance-core"
version = "0.1.0"
edition = "2021"
description = "Core policy and evidence primitives for agent action assurance"
license = "Apache-2.0"

[lib]
name = "agent_assurance_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
jsonschema = "0.18"
