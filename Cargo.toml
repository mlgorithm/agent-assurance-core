[package]
name = "agent-assurance-core"
version = "0.2.0"
edition = "2021"
description = "An OS-style assurance kernel for untrusted AI agents: policy + capability + risk-budget decisions and head-anchored, tamper-evident action evidence"
license = "Apache-2.0"

[lib]
name = "agent_assurance_core"
path = "src/lib.rs"
# rlib for the Rust distributions; cdylib/staticlib for the C ABI + WASM bindings.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

# WASM target: getrandom needs its js backend to compile for wasm32. (The verify
# surface uses no randomness, but the dependency tree pulls getrandom in.)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3"
jsonschema = "0.18"
